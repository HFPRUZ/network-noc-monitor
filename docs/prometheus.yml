global:
  scrape_interval: 60s

remote_write:
  - url: https://prometheus-xxx.grafana.net/api/prom/push
    basic_auth:
      username: "<YOUR_GRAFANA_CLOUD_INSTANCE_ID>"
      password: "<YOUR_GRAFANA_CLOUD_ACCESS_POLICY_TOKEN>"

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['localhost:9100']

  - job_name: 'tailscale'
    metrics_path: /metrics
    static_configs:
      - targets: ['100.100.100.100']

  - job_name: 'blackbox_network'
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets:
        - 192.168.0.1
        - 192.168.0.50
        - 192.168.0.49
        - example-device.local
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: localhost:9115